<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dietary Safety Profile</title>
    <link rel="stylesheet" href="styles.css?v=20" />
  </head>
  <body>
    <main class="app-shell">
      <section class="phone" aria-label="Dietary safety app">
        <header class="status-bar" aria-hidden="true">
          <span>9:41</span>
          <span class="signal">LTE</span>
        </header>

        <header class="top-bar">
          <button class="icon-btn" id="backBtn" aria-label="Go back"></button>
          <div>
            <p class="eyebrow" id="screenEyebrow"></p>
            <h1 id="screenTitle"></h1>
          </div>
          <button class="text-btn" id="headerAction"></button>
        </header>

        <section class="content" id="content" tabindex="-1"></section>

        <nav class="tab-bar" aria-label="Primary navigation">
          <button data-tab="home" class="tab active" type="button">
            <span class="tab-icon home-icon"></span>
            <span>Home</span>
          </button>
          <button data-tab="scan" class="tab" type="button">
            <span class="tab-icon scan-icon"></span>
            <span>Scan</span>
          </button>
          <button data-tab="profile" class="tab" type="button">
            <span class="tab-icon profile-icon"></span>
            <span>Profile</span>
          </button>
          <button data-tab="history" class="tab" type="button">
            <span class="tab-icon history-icon"></span>
            <span>History</span>
          </button>
          <button data-tab="settings" class="tab" type="button">
            <span class="tab-icon settings-icon"></span>
            <span>Settings</span>
          </button>
        </nav>
      </section>
    </main>
    <script type="module" src="app.js?v=20"></script>
  </body>
</html>
